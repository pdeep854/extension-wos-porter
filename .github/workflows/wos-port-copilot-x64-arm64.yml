name: WoS Port with x64 Benchmark (Copilot CLI, x64 → ARM64)

# Two-job pipeline:
#   job1 (x64-benchmark): Runs on a Windows x64 runner. Invokes the
#     x64-benchmarker Copilot agent to build the target repo for x64,
#     run all tests and benchmarks, and upload the x64_benchmark/ result
#     as a workflow artifact.
#   job2 (arm64-port): Runs on a Windows ARM64 runner. Downloads the
#     x64 benchmark artifact from job1, then invokes the wos-porter
#     Copilot agent passing the repo URL and the local x64_benchmark
#     result path so the optimizer can close performance gaps. Uploads
#     all ARM64 port patches and the run log as artifacts.
#
# Auth: requires a repo secret COPILOT_GITHUB_TOKEN containing a
# fine-grained PAT (v2) with the "Copilot Requests" permission.

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository to port (https://github.com/owner/repo or owner/repo)"
        required: true
        type: string
      copilot_model:
        description: "Copilot CLI model (auto, claude-sonnet-4.6, gpt-5.4, claude-haiku-4.5, ...)"
        required: false
        type: string
        default: "auto"
      max_autopilot_continues:
        description: "Max autopilot continuation messages before the CLI stops"
        required: false
        type: string
        default: "400"

concurrency:
  group: wos-port-copilot-x64-arm64-${{ github.event.inputs.repo_url }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — x64 benchmark (Windows x64 runner)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  x64-benchmark:
    name: x64 Benchmark – ${{ github.event.inputs.repo_url }}
    runs-on: windows-latest          # standard x64 Windows runner
    timeout-minutes: 180
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ALLOW_ALL: "true"
      WOS_REPO_URL: ${{ github.event.inputs.repo_url }}
      COPILOT_MODEL: ${{ github.event.inputs.copilot_model }}
      MAX_AUTOPILOT_CONTINUES: ${{ github.event.inputs.max_autopilot_continues }}
      X64_BENCH_WORKDIR: C:\src\x64-bench

    steps:
      - name: Checkout extension (for agent + skill sources)
        uses: actions/checkout@v4

      - name: Verify COPILOT_GITHUB_TOKEN is set
        shell: pwsh
        run: |
          if (-not $env:COPILOT_GITHUB_TOKEN) {
            Write-Error "COPILOT_GITHUB_TOKEN secret is not configured. Create a fine-grained PAT with the 'Copilot Requests' permission and store it as COPILOT_GITHUB_TOKEN."
            exit 1
          }
          Write-Host "COPILOT_GITHUB_TOKEN present (length=$($env:COPILOT_GITHUB_TOKEN.Length))"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install GitHub Copilot CLI
        shell: pwsh
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Install wos-* agents, skills, instructions, and prompts into ~/.copilot
        shell: pwsh
        run: |
          $userHome  = $env:USERPROFILE
          $agentsDst = Join-Path $userHome ".copilot\agents"
          $instrDst  = Join-Path $userHome ".copilot\instructions"
          $skillsDst = Join-Path $userHome ".copilot\skills"
          $promptsDst = Join-Path $userHome ".copilot\prompts"
          New-Item -ItemType Directory -Force -Path $agentsDst, $instrDst, $skillsDst, $promptsDst | Out-Null

          # Strip Copilot-incompatible frontmatter keys (tools, agents,
          # argument-hint, user-invocable) during install.
          Get-ChildItem "$env:GITHUB_WORKSPACE\agents\x64-benchmarker.agent.md" |
            ForEach-Object {
              $srcPath = $_.FullName
              $dstPath = Join-Path $agentsDst $_.Name
              $raw = Get-Content -Raw -LiteralPath $srcPath
              if ($raw -notmatch '(?s)^---\r?\n(.*?)\r?\n---\r?\n(.*)$') {
                Write-Error "No YAML frontmatter in $srcPath"; exit 1
              }
              $fmLines = ($Matches[1] -split "`r?`n") | Where-Object {
                $_ -notmatch '^\s*(tools|agents|argument-hint|user-invocable)\s*:'
              }
              $out = "---`n$(($fmLines -join "`n").Trim())`n---`n$($Matches[2])"
              Set-Content -LiteralPath $dstPath -Value $out -Encoding UTF8
              Write-Host "Installed agent: $dstPath"
            }

          Copy-Item "$env:GITHUB_WORKSPACE\instructions\*.instructions.md" `
            -Destination $instrDst -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE\skills" -Directory | ForEach-Object {
            $dst = Join-Path $skillsDst $_.Name
            Copy-Item $_.FullName -Destination $dst -Recurse -Force
            Write-Host "Installed skill: $dst"
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\prompts") {
            Copy-Item "$env:GITHUB_WORKSPACE\prompts\*.prompt.md" `
              -Destination $promptsDst -Force -ErrorAction SilentlyContinue
          }

          "COPILOT_CUSTOM_INSTRUCTIONS_DIRS=$instrDst" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create x64-bench work directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\src\x64-bench" | Out-Null

      - name: Run x64-benchmarker agent (Copilot CLI)
        working-directory: C:\src\x64-bench
        shell: pwsh
        run: |
          # Continue throughout: do NOT use 2>&1 — in PowerShell 5.1, redirecting
          # stderr from a native command wraps each line in an ErrorRecord, which
          # would terminate the script on the first copilot log line. The runner
          # captures stderr separately without needing the redirect.
          $ErrorActionPreference = 'Continue'
          $logDir = "C:\src\x64-bench\_logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $repoName = ($env:WOS_REPO_URL -split '/')[-1] -replace '\.git$',''
          $prompt = @"
Build and benchmark this repository for x64: $env:WOS_REPO_URL

IMPORTANT:
- Set your workRoot to: $env:X64_BENCH_WORKDIR
- Clone the repository under: $env:X64_BENCH_WORKDIR
- Create x64_benchmark/ inside the cloned repo: $env:X64_BENCH_WORKDIR\$repoName\x64_benchmark
- Run ALL 7 phases without skipping any
"@
          Write-Host "Prompt: $prompt"
          Write-Host "Model:  $env:COPILOT_MODEL"

          copilot `
            -p $prompt `
            --agent=x64-benchmarker `
            --model=$env:COPILOT_MODEL `
            --autopilot `
            --max-autopilot-continues ([int]$env:MAX_AUTOPILOT_CONTINUES) `
            --allow-all-tools `
            --allow-all-paths `
            --allow-all-urls `
            --output-format=json `
            --log-dir=$logDir `
            --log-level=info |
            Tee-Object -FilePath (Join-Path $logDir "copilot-x64-run.jsonl")

          # $? is false if copilot was not found (CommandNotFoundException);
          # $LASTEXITCODE is non-zero if copilot ran but exited with an error.
          if (-not $? -or $LASTEXITCODE -ne 0) {
            Write-Warning "copilot x64-benchmarker exited with code $LASTEXITCODE (command found: $?) — artifacts will still be uploaded."
          }

      - name: Locate x64_benchmark output directory
        id: locate_bench
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # The x64-benchmarker agent writes all artifacts under:
          #   <workRoot>/<repoName>/x64_benchmark/
          # Exact files produced per phase:
          #   Phase 2: targets.txt
          #   Phase 3: build.log
          #   Phase 4: test_results.log
          #   Phase 6: results/base_bench_x64.<ext>          (JSON/CSV/XML/TXT/HTML)
          #            results/base_bench_x64/               (Criterion multi-file)
          #            results/base_bench_x64.meta.json      (CPU/OS/toolchain metadata)
          #            generated_bench.<ext>                 (auto-generated source, if 6B)
          #            bench_build.log                       (benchmark build log, if 6B)
          #   Phase 7: REPORT.md                             (written last — may be absent on timeout)
          #
          # We locate x64_benchmark/ and upload the whole tree. Phase 6 results
          # are the primary payload; REPORT.md is a nice-to-have summary only.
          $workRoot = $env:X64_BENCH_WORKDIR
          $repoName = ($env:WOS_REPO_URL -split '/')[-1] -replace '\.git$',''
          $benchDir = Join-Path $workRoot "$repoName\x64_benchmark"

          if (-not (Test-Path $benchDir)) {
            Write-Warning "Expected x64_benchmark dir not found at $benchDir — falling back to full workdir search."

            # Check if the repo was at least cloned, to distinguish
            # "agent never ran" from "agent ran but did not reach Phase 2".
            $repoDir = Join-Path $workRoot $repoName
            if (Test-Path (Join-Path $repoDir '.git')) {
              Write-Host "Repo was cloned at $repoDir but x64_benchmark/ was never created — agent failed before or during Phase 2."
            } elseif (Test-Path $workRoot) {
              $clonedDirs = Get-ChildItem $workRoot -Directory -ErrorAction SilentlyContinue |
                              Where-Object { Test-Path (Join-Path $_.FullName '.git') }
              if ($clonedDirs) {
                Write-Host "Repo cloned to unexpected dir(s): $($clonedDirs.FullName -join ', ')"
              } else {
                Write-Warning "No cloned repo found under $workRoot — agent may not have run at all or clone failed."
              }
            } else {
              Write-Warning "$workRoot does not exist — agent did not run (Copilot CLI may have failed to start)."
            }

            # Search under workRoot and one level up (C:\src\) in case the
            # agent created x64_benchmark/ directly under workRoot or a sibling.
            $searchRoots = @($workRoot, (Split-Path $workRoot -Parent))
            $found = $null
            foreach ($root in $searchRoots) {
              $found = Get-ChildItem $root -Recurse -Directory -Filter x64_benchmark `
                         -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { break }
            }
            if ($found) {
              $benchDir = $found.FullName
              Write-Host "Found x64_benchmark at $benchDir"
            } else {
              Write-Warning "No x64_benchmark directory found under $workRoot — benchmark agent did not complete Phase 2."
              "bench_dir="      | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "repo_name=$repoName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }

          "bench_dir=$benchDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "repo_name=$repoName"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Enumerate every artifact file produced, grouped by phase.
          Write-Host "`n=== x64_benchmark artifact inventory ==="
          $knownFiles = @(
            "targets.txt",          # Phase 2
            "build.log",            # Phase 3
            "test_results.log",     # Phase 4
            "bench_build.log",      # Phase 6B
            "REPORT.md"             # Phase 7
          )
          foreach ($f in $knownFiles) {
            $p = Join-Path $benchDir $f
            if (Test-Path $p) { Write-Host "  [present] $f" }
            else               { Write-Host "  [absent]  $f" }
          }
          # Phase 6 result files (variable extension/layout)
          $resultsDir = Join-Path $benchDir "results"
          if (Test-Path $resultsDir) {
            $resultFiles = Get-ChildItem $resultsDir -Recurse -File -ErrorAction SilentlyContinue
            if ($resultFiles) {
              Write-Host "  [present] results/ ($($resultFiles.Count) file(s)):"
              $resultFiles | ForEach-Object { Write-Host "    $($_.Name)" }
            } else {
              Write-Host "  [absent]  results/ (dir exists but empty — Phase 6 did not complete)"
            }
          } else {
            Write-Host "  [absent]  results/ — Phase 6 did not run"
          }
          # Auto-generated benchmark source (Phase 6B, variable extension)
          $genBench = Get-ChildItem $benchDir -File -Filter "generated_bench.*" -ErrorAction SilentlyContinue
          if ($genBench) { Write-Host "  [present] $($genBench.Name) (auto-generated benchmark source)" }
          Write-Host "========================================`n"

      - name: Upload x64 benchmark results
        if: always() && steps.locate_bench.outputs.bench_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: x64-benchmark-${{ steps.locate_bench.outputs.repo_name }}
          path: ${{ steps.locate_bench.outputs.bench_dir }}/**
          if-no-files-found: warn

      - name: Upload x64 benchmarker run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x64-benchmarker-log-${{ steps.locate_bench.outputs.repo_name }}
          path: C:\src\x64-bench\_logs\**
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — ARM64 port (Windows ARM64 runner)
# ─────────────────────────────────────────────────────────────────────────────
  arm64-port:
    name: ARM64 Port – ${{ github.event.inputs.repo_url }}
    runs-on: windows-11-arm
    needs: x64-benchmark
    # Run if job1 succeeded or failed — but NOT if it was cancelled, to avoid
    # spinning up a 6-hour ARM64 runner after a manual workflow cancellation.
    if: needs.x64-benchmark.result != 'cancelled'
    timeout-minutes: 360
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ALLOW_ALL: "true"
      WOS_REPO_URL: ${{ github.event.inputs.repo_url }}
      COPILOT_MODEL: ${{ github.event.inputs.copilot_model }}
      MAX_AUTOPILOT_CONTINUES: ${{ github.event.inputs.max_autopilot_continues }}

    steps:
      - name: Checkout extension (for agent + skill sources)
        uses: actions/checkout@v4

      - name: Verify COPILOT_GITHUB_TOKEN is set
        shell: pwsh
        run: |
          if (-not $env:COPILOT_GITHUB_TOKEN) {
            Write-Error "COPILOT_GITHUB_TOKEN secret is not configured. Create a fine-grained PAT with the 'Copilot Requests' permission and store it as COPILOT_GITHUB_TOKEN."
            exit 1
          }
          Write-Host "COPILOT_GITHUB_TOKEN present (length=$($env:COPILOT_GITHUB_TOKEN.Length))"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install GitHub Copilot CLI
        shell: pwsh
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Show preinstalled ARM64 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $vsPath = & $vswhere -latest -property installationPath
          Write-Host "VS install: $vsPath"
          $cl = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'HostARM64\\ARM64' } |
                Select-Object -First 1 -ExpandProperty FullName
          if (-not $cl) {
            $cl = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter cl.exe |
                  Where-Object { $_.FullName -match 'Hostx64\\arm64' } |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "ARM64-target cl.exe: $cl"
          Get-Command cmake, ninja, git, python -ErrorAction SilentlyContinue |
            Format-Table Name, Source

      - name: Derive repo name for artifact lookup
        id: repo_name
        shell: pwsh
        run: |
          $repoName = ($env:WOS_REPO_URL -split '/')[-1] -replace '\.git$',''
          "repo_name=$repoName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download x64 benchmark results from job1
        id: download_bench
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: x64-benchmark-${{ steps.repo_name.outputs.repo_name }}
          path: C:\src\x64-bench-results

      - name: Resolve x64 benchmark path for porter
        id: bench_path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $resultsRoot = "C:\src\x64-bench-results"
          if (-not (Test-Path $resultsRoot)) {
            Write-Warning "x64 benchmark artifact was not downloaded — porter will run without benchmark data."
            "x64_bench_dir=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          # The artifact is the full x64_benchmark/ tree. Locate it by finding
          # any known Phase-6 result file (base_bench_x64.*) inside results/.
          # That file's grandparent is x64_benchmark/. If no result files exist
          # (Phase 6 did not complete) fall back to a known Phase-3/4 artifact
          # (build.log or test_results.log) whose parent is x64_benchmark/.
          $benchDir = $null

          $resultFile = Get-ChildItem $resultsRoot -Recurse -File `
                          -ErrorAction SilentlyContinue |
                        Where-Object { $_.Name -match 'base_bench_x64' } |
                        Select-Object -First 1
          if ($resultFile) {
            # results/base_bench_x64.* → parent=results/ → grandparent=x64_benchmark/
            $benchDir = $resultFile.Directory.Parent.FullName
            Write-Host "Located x64_benchmark/ via Phase-6 result file: $($resultFile.Name)"
          } else {
            # Phase 6 did not complete; try Phase-3/4 artifacts
            $fallbackFile = Get-ChildItem $resultsRoot -Recurse -File `
                              -ErrorAction SilentlyContinue |
                            Where-Object { $_.Name -in @('build.log','test_results.log','targets.txt','REPORT.md') } |
                            Select-Object -First 1
            if ($fallbackFile) {
              $benchDir = $fallbackFile.DirectoryName
              Write-Warning "No Phase-6 result files found — using x64_benchmark/ located via $($fallbackFile.Name)"
            } else {
              Write-Warning "No known x64_benchmark artifacts found — using artifact root as-is."
              $benchDir = $resultsRoot
            }
          }

          "x64_bench_dir=$benchDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Log every file present so the porter knows what data is available.
          Write-Host "`n=== x64 benchmark artifact contents on ARM64 runner ==="
          Get-ChildItem $benchDir -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName -replace [regex]::Escape($benchDir), '')" }
          Write-Host "====================================================`n"

      - name: Install wos-* agents, skills, instructions, and prompts into ~/.copilot
        shell: pwsh
        run: |
          $userHome  = $env:USERPROFILE
          $agentsDst = Join-Path $userHome ".copilot\agents"
          $instrDst  = Join-Path $userHome ".copilot\instructions"
          $skillsDst = Join-Path $userHome ".copilot\skills"
          $promptsDst = Join-Path $userHome ".copilot\prompts"
          New-Item -ItemType Directory -Force -Path $agentsDst, $instrDst, $skillsDst, $promptsDst | Out-Null

          Get-ChildItem "$env:GITHUB_WORKSPACE\agents\wos-*.agent.md" | ForEach-Object {
            $srcPath = $_.FullName
            $dstPath = Join-Path $agentsDst $_.Name
            $raw = Get-Content -Raw -LiteralPath $srcPath
            if ($raw -notmatch '(?s)^---\r?\n(.*?)\r?\n---\r?\n(.*)$') {
              Write-Error "No YAML frontmatter in $srcPath"; exit 1
            }
            $fmLines = ($Matches[1] -split "`r?`n") | Where-Object {
              $_ -notmatch '^\s*(tools|agents|argument-hint|user-invocable)\s*:'
            }
            $out = "---`n$(($fmLines -join "`n").Trim())`n---`n$($Matches[2])"
            Set-Content -LiteralPath $dstPath -Value $out -Encoding UTF8
            Write-Host "Installed agent: $dstPath"
          }

          Copy-Item "$env:GITHUB_WORKSPACE\instructions\*.instructions.md" `
            -Destination $instrDst -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE\skills" -Directory | ForEach-Object {
            $dst = Join-Path $skillsDst $_.Name
            Copy-Item $_.FullName -Destination $dst -Recurse -Force
            Write-Host "Installed skill: $dst"
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\prompts") {
            Copy-Item "$env:GITHUB_WORKSPACE\prompts\*.prompt.md" `
              -Destination $promptsDst -Force -ErrorAction SilentlyContinue
          }

          "COPILOT_CUSTOM_INSTRUCTIONS_DIRS=$instrDst" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create wos-porter work directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\src\wos-porter" | Out-Null

      - name: Run wos-porter agent (Copilot CLI)
        working-directory: C:\src\wos-porter
        shell: pwsh
        run: |
          # Continue throughout: same 2>&1 / ErrorRecord reason as x64-benchmarker step.
          $ErrorActionPreference = 'Continue'
          $workRoot = "C:\src\wos-porter"
          $logDir = Join-Path $workRoot "_logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          # Build the prompt. If an x64 benchmark result was downloaded,
          # tell the porter where to find it so the optimizer can use it.
          $x64BenchDir = "${{ steps.bench_path.outputs.x64_bench_dir }}"
          $repoName = ($env:WOS_REPO_URL -split '/')[-1] -replace '\.git$',''
          $workRoot = "C:\src\wos-porter"

          if ($x64BenchDir -and (Test-Path $x64BenchDir)) {
            $prompt = @"
Port this repository to Windows ARM64: $env:WOS_REPO_URL

IMPORTANT:
- Clone the repository under: $workRoot
- All work must be done on a branch named: arm64-port
- Write the port summary to: $workRoot\$repoName\ARM64-PORT.md
- An x64 benchmark result is available at: $x64BenchDir — use it to guide ARM64 optimizations
- Run ALL 8 phases without skipping any
"@
          } else {
            $prompt = @"
Port this repository to Windows ARM64: $env:WOS_REPO_URL

IMPORTANT:
- Clone the repository under: $workRoot
- All work must be done on a branch named: arm64-port
- Write the port summary to: $workRoot\$repoName\ARM64-PORT.md
- Run ALL 8 phases without skipping any
"@
          }

          Write-Host "Prompt: $prompt"
          Write-Host "Model:  $env:COPILOT_MODEL"

          copilot `
            -p $prompt `
            --agent=wos-porter `
            --model=$env:COPILOT_MODEL `
            --autopilot `
            --max-autopilot-continues ([int]$env:MAX_AUTOPILOT_CONTINUES) `
            --allow-all-tools `
            --allow-all-paths `
            --allow-all-urls `
            --output-format=json `
            --log-dir=$logDir `
            --log-level=info |
            Tee-Object -FilePath (Join-Path $logDir "copilot-arm64-run.jsonl")

          if (-not $? -or $LASTEXITCODE -ne 0) {
            Write-Warning "copilot wos-porter exited with code $LASTEXITCODE (command found: $?) — artifacts will still be uploaded."
          }

      - name: Locate ported repo
        id: locate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $portedRoot = "C:\src\wos-porter"
          if (-not (Test-Path $portedRoot)) {
            Write-Warning "$portedRoot does not exist — porter never ran or failed before cloning."
            "ported_repo=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $candidates = Get-ChildItem -Directory $portedRoot -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne '_logs' -and (Test-Path (Join-Path $_.FullName '.git')) }
          if (-not $candidates) {
            Write-Warning "No cloned repo found under $portedRoot."
            "ported_repo=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $ported = $candidates | Select-Object -First 1
          Write-Host "Ported repo: $($ported.FullName)"
          "ported_repo=$($ported.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ported_name=$($ported.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate arm64-port patch + summary
        if: always() && steps.locate.outputs.ported_repo != ''
        working-directory: ${{ steps.locate.outputs.ported_repo }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $outDir = "C:\src\wos-porter\_artifacts"
          $seriesDir = Join-Path $outDir "patches"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $port = 'arm64-port'
          $portSha = (git rev-parse --verify --quiet "refs/heads/$port")
          if (-not $portSha) {
            Write-Warning "Branch '$port' not found — capturing working-tree diff as fallback."
            git status | Tee-Object (Join-Path $outDir "git-status.txt") | Out-Null
            git diff --binary HEAD | Out-File -Encoding ascii (Join-Path $outDir "working-tree.diff")
            exit 0
          }

          $base = $null
          foreach ($cand in @('main','master','origin/main','origin/master','origin/HEAD')) {
            if ($cand -eq $port) { continue }
            $sha = (git rev-parse --verify --quiet $cand)
            if ($sha) { $base = $cand; break }
          }
          if (-not $base) {
            $base = (git rev-list --max-parents=0 "$port" | Select-Object -Last 1)
          }

          $forkPointRaw = git merge-base $base $port
          $forkPoint = if ($forkPointRaw) { $forkPointRaw.Trim() } else { $null }
          if (-not $forkPoint) { $forkPoint = $base }
          Write-Host "Base: $base  fork-point: $forkPoint  port-tip: $portSha"

          $range = "$forkPoint..$port"
          $commitCount = [int](git rev-list --count $range)
          Write-Host "Commits on $port since fork: $commitCount"

          git log --oneline $range | Tee-Object (Join-Path $outDir "commits.txt")
          git diff --stat $range   | Tee-Object (Join-Path $outDir "diffstat.txt")

          if ($commitCount -eq 0) {
            Write-Warning "No commits on '$port' — capturing working-tree diff as fallback."
            git diff --binary $range | Out-File -Encoding ascii (Join-Path $outDir "arm64-port.diff")
            git diff --binary HEAD   | Out-File -Encoding ascii (Join-Path $outDir "working-tree.diff")
          } else {
            $combined = Join-Path $outDir "arm64-port.patch"
            $diffText = (git diff --binary $range | Out-String)
            [System.IO.File]::WriteAllText($combined, $diffText, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "Wrote combined patch: $combined"

            New-Item -ItemType Directory -Force -Path $seriesDir | Out-Null
            $series = git format-patch $range -o $seriesDir
            Write-Host "Wrote $($series.Count) per-commit patch file(s) to $seriesDir"
          }

          if (Test-Path "ARM64-PORT.md") {
            Copy-Item "ARM64-PORT.md" (Join-Path $outDir "ARM64-PORT.md") -Force
          } else {
            Write-Warning "ARM64-PORT.md not produced — Phase 8 did not complete."
          }

      - name: Upload ARM64 porter run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-porter-log-${{ steps.locate.outputs.ported_name || 'run' }}
          path: C:\src\wos-porter\_logs\**
          if-no-files-found: warn

      - name: Upload ARM64 port artifacts (patches + report)
        if: always() && steps.locate.outputs.ported_repo != ''
        uses: actions/upload-artifact@v4
        with:
          name: arm64-port-copilot-${{ steps.locate.outputs.ported_name }}
          path: C:\src\wos-porter\_artifacts\**
          if-no-files-found: warn

      - name: Upload full ported working tree (branch arm64-port)
        if: always() && steps.locate.outputs.ported_repo != ''
        uses: actions/upload-artifact@v4
        with:
          name: ported-repo-copilot-${{ steps.locate.outputs.ported_name }}
          path: |
            ${{ steps.locate.outputs.ported_repo }}/**
            !${{ steps.locate.outputs.ported_repo }}/**/node_modules/**
            !${{ steps.locate.outputs.ported_repo }}/**/target/**
            !${{ steps.locate.outputs.ported_repo }}/**/build/**
            !${{ steps.locate.outputs.ported_repo }}/**/build-arm64/**
            !${{ steps.locate.outputs.ported_repo }}/**/out/**
            !${{ steps.locate.outputs.ported_repo }}/**/x64/**
            !${{ steps.locate.outputs.ported_repo }}/**/Debug/**
            !${{ steps.locate.outputs.ported_repo }}/**/Release/**
          if-no-files-found: warn
